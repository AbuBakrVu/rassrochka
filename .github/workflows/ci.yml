# Проверка каждого пуша и пул-реквеста: то же, что разработчик запускает
# локально перед коммитом. Красная проверка — не сливать.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # та же версия, что в Dockerfile
          cache: npm

      - run: npm ci

      - name: Типы
        run: npx tsc --noEmit

      - name: Линтер
        run: npm run lint

      - name: Тесты денежной логики
        run: npm test

      - name: Сборка
        run: npm run build
        env:
          APP_DOMAIN: example.ru
